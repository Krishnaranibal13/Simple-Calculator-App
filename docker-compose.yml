services:

  database:
    image: postgres:17-alpine
    container_name: calculator-database

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - calculator_postgres_data:/var/lib/postgresql/data

    networks:
      - calculator-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: calculator-backend

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}

    expose:
      - "8000"

    depends_on:
      database:
        condition: service_healthy

    networks:
      - calculator-network


  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    container_name: calculator-frontend

    expose:
      - "3000"

    depends_on:
      - backend

    networks:
      - calculator-network


  nginx:
    image: nginx:alpine
    container_name: calculator-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend

    networks:
      - calculator-network


volumes:
  calculator_postgres_data:


networks:
  calculator-network:
    driver: bridge
